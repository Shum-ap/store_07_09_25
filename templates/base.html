<!DOCTYPE html>
<html lang="ru">
<head>

    <title>{% block title %}Магазин{% endblock %}</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <h1>🛒 Магазин товаров</h1>
